<title>隙浮 Wiki</title>
<meta name="description" content="The Sift（隙浮）Minecraft 模組的完整介紹：故事、生態域、生物、建築、方塊、物品與合成表。A complete guide to The Sift Minecraft mod.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* The Sift Wiki: a MediaWiki / minecraft.wiki layout (sidebar portlets, serif headings, wikitables, infobox, TOC,
   navbox), tinted with the Sift's mint dusk. Inventory GUI look for recipes. */
:root {
  --page: #f6f6f6;
  --paper: #ffffff;
  --ink: #202122;
  --muted: #54595d;
  --line: #a2a9b1;
  --line-soft: #c8ccd1;
  --link: #0645ad;
  --th: #eaecf0;
  --box: #f8f9fa;
  --mint: #c7ebdf;
  --mint-ink: #163c33;
  --mint-deep: #2e8f7c;
  --slot-hi: #ffffff;
  --slot-lo: #373737;
  --slot-bg: #8b8b8b;
  --gui: #c6c6c6;
  --gui-ink: #3f3f3f;
  --codex: #f5efe0;
  --codex-ink: #3b3024;
  --serif: "Linux Libertine", "Georgia", "Times", "Noto Serif TC", serif;
  --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #101317; --paper: #181b20; --ink: #e2e4e7; --muted: #a2a9b1; --line: #4a5058; --line-soft: #343a41;
    --link: #88b4f0; --th: #262b31; --box: #1f2328; --mint: #1f4840; --mint-ink: #d7f5ec; --mint-deep: #63d1b9;
    --slot-hi: #7d8087; --slot-lo: #16181b; --slot-bg: #55585e; --gui: #393c41; --gui-ink: #e2e4e7;
    --codex: #2a261f; --codex-ink: #eadfc8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #101317; --paper: #181b20; --ink: #e2e4e7; --muted: #a2a9b1; --line: #4a5058; --line-soft: #343a41;
  --link: #88b4f0; --th: #262b31; --box: #1f2328; --mint: #1f4840; --mint-ink: #d7f5ec; --mint-deep: #63d1b9;
  --slot-hi: #7d8087; --slot-lo: #16181b; --slot-bg: #55585e; --gui: #393c41; --gui-ink: #e2e4e7;
  --codex: #2a261f; --codex-ink: #eadfc8; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.6 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--page); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--mint-deep); outline-offset: 2px; }
code { font: 12.5px ui-monospace, Consolas, monospace; background: var(--box); border: 1px solid var(--line-soft);
  padding: 0 4px; border-radius: 2px; }

/* ------------------------------------------------------------------ frame */
.layout { display: flex; min-height: 100vh; }
.side { width: 176px; flex: none; padding: 0 0 40px max(8px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 8px 18px; color: var(--ink);
  font: 700 16px/1.2 var(--serif); text-align: center; }
.brand:hover { text-decoration: none; }
.portlet { margin: 0 6px 14px 4px; }
.portlet h3 { font: 600 12px var(--sans); color: var(--muted); margin: 0 0 4px 6px; padding-bottom: 3px;
  border-bottom: 1px solid var(--line-soft); }
.portlet a { display: block; padding: 2px 6px; font-size: 13px; border-radius: 2px; }
.portlet a.on { font-weight: 700; color: var(--ink); background: var(--mint); }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px;
  padding: 10px 0; background: var(--page); }
.search { position: relative; margin-left: auto; width: min(380px, 100%); }
.search input { width: 100%; padding: 6px 10px; font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 2px; outline: none; }
.search input:focus { border-color: var(--link); box-shadow: inset 0 0 0 1px var(--link); }
.results { position: absolute; top: 36px; left: 0; right: 0; max-height: 70vh; overflow: auto; background: var(--paper);
  border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .18); z-index: 25; }
.results a { display: flex; gap: 8px; padding: 6px 10px; color: var(--ink); border-bottom: 1px solid var(--line-soft); }
.results a:hover { background: var(--box); text-decoration: none; }
.results .k { font-size: 11px; color: var(--muted); min-width: 3.6em; }
.results .none { padding: 8px 10px; color: var(--muted); }
.tool { height: 32px; min-width: 32px; padding: 0 8px; font: inherit; font-size: 13px; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 2px; cursor: pointer; }
.tool:hover { background: var(--box); }
.menu { display: none; }
.content { flex: 1; background: var(--paper); border: 1px solid var(--line); padding: 18px 24px 28px; min-width: 0; }
.content::after { content: ""; display: block; clear: both; }
.foot { padding: 12px 4px 30px; font-size: 12px; color: var(--muted); }

/* ------------------------------------------------------------------ article typography (Vector) */
h1, h2 { font-family: var(--serif); font-weight: 500; color: var(--ink); text-wrap: balance; }
h1 { font-size: 28.8px; line-height: 1.3; margin: 0 0 4px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
h2 { font-size: 21px; line-height: 1.3; margin: 22px 0 8px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
h3 { font-size: 16px; font-weight: 700; margin: 16px 0 4px; }
h2 small, h1 small { font: 12px var(--sans); color: var(--muted); margin-left: 8px; }
p { margin: 6px 0 10px; }
ul, ol { padding-left: 26px; margin: 4px 0 10px; }
li { margin: 2px 0; }
.crumbs { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.muted { color: var(--muted); }
.note { background: var(--box); border: 1px solid var(--line-soft); border-left: 4px solid var(--mint-deep);
  padding: 6px 12px; margin: 10px 0; }
.tip { background: #100010; color: #fff; border: 2px solid #28007a; outline: 2px solid #100010; padding: 6px 10px;
  margin: 8px 2px 12px; font-size: 14px; display: inline-block; max-width: 100%; }
.tip div + div { color: #aaa; }
blockquote.codex { margin: 10px 0; padding: 10px 14px; background: var(--codex); color: var(--codex-ink);
  border: 1px solid var(--line-soft); font-family: var(--serif); font-size: 14.5px; }

/* ------------------------------------------------------------------ wikitable */
table.wt { border-collapse: collapse; margin: 8px 0 14px; background: var(--box); border: 1px solid var(--line);
  display: block; overflow-x: auto; max-width: 100%; }
table.wt th, table.wt td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: middle; }
table.wt th { background: var(--th); font-weight: 700; white-space: nowrap; }

/* ------------------------------------------------------------------ infobox */
.infobox { float: right; clear: right; width: 290px; margin: 0 0 12px 18px; border: 1px solid var(--line); background: var(--box);
  font-size: 13px; }
.ib-t { background: var(--mint); color: var(--mint-ink); text-align: center; font: 700 16px var(--serif); padding: 6px; }
.ib-s { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 6px 0; }
.ib-i { text-align: center; padding: 8px; }
.ib-i img { max-width: 100%; display: block; margin: 0 auto; border: 1px solid var(--line-soft); }
.ib-icon { padding: 14px; }
.infobox table { width: 100%; border-collapse: collapse; }
.infobox th, .infobox td { padding: 4px 8px; border-top: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
.infobox th { width: 40%; font-weight: 700; }

/* ------------------------------------------------------------------ TOC and navbox */
.toc { display: table; background: var(--box); border: 1px solid var(--line); padding: 6px 12px 8px; margin: 10px 0 14px;
  font-size: 13px; }
.toc-t { font-weight: 700; text-align: center; margin-bottom: 4px; }
.toc ul { list-style: none; padding: 0; margin: 0; }
.toc li.sub { padding-left: 18px; }
.toc .tn { color: var(--ink); margin-right: 6px; }
table.navbox { width: 100%; clear: both; border-collapse: collapse; margin-top: 26px; border: 1px solid var(--line);
  font-size: 13px; background: var(--box); }
.navbox th { background: var(--mint); color: var(--mint-ink); padding: 4px 8px; font-weight: 700; }
.navbox th a { color: inherit; }
.navbox td { padding: 6px 10px; line-height: 1.8; }

/* ------------------------------------------------------------------ icons (atlas of 64 px cells) */
.ic { display: inline-block; vertical-align: middle; background-image: url(img/icons.png); image-rendering: pixelated; flex: none; }
.ic.s24 { width: 24px; height: 24px; background-size: calc(32 * 24px) auto; background-position: calc(var(--x) * -24px) calc(var(--y) * -24px); }
.ic.s32 { width: 32px; height: 32px; background-size: calc(32 * 32px) auto; background-position: calc(var(--x) * -32px) calc(var(--y) * -32px); }
.ic.s64, .ic.logo { width: 96px; height: 96px; background-size: calc(32 * 96px) auto; background-position: calc(var(--x) * -96px) calc(var(--y) * -96px); }
.il { display: inline-flex; align-items: center; gap: 3px; margin-right: 3px; white-space: nowrap; }

/* ------------------------------------------------------------------ recipes: the inventory GUI */
.recipes { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 12px; }
.recipe { background: var(--gui); color: var(--gui-ink); border: 2px solid; border-color: var(--slot-hi) var(--slot-lo) var(--slot-lo) var(--slot-hi);
  padding: 5px 9px 6px; }
.rk { font-size: 11.5px; margin-bottom: 4px; }
.rn { font-size: 12.5px; margin-top: 4px; max-width: 240px; }
.rb { display: flex; align-items: center; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 36px); }
.row { display: flex; align-items: center; gap: 4px; }
.slot { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; position: relative;
  background: var(--slot-bg); border: 2px solid; border-color: var(--slot-lo) var(--slot-hi) var(--slot-hi) var(--slot-lo); }
.slot.big { width: 46px; height: 46px; }
.slot .cyc { display: none; }
.slot .cyc.on { display: inline-flex; }
.slot a:hover { text-decoration: none; }
.cnt { position: absolute; right: 1px; bottom: -2px; color: #fff; font-weight: 700; font-size: 14px; text-shadow: 2px 2px 0 #3f3f3f; }
.arrow { font-size: 24px; opacity: .65; }
.flame { width: 14px; height: 18px; display: inline-block; border-radius: 50% 50% 40% 40%;
  background: radial-gradient(circle at 50% 70%, #ffd35a, #e2641f 70%); }
.tag { font-size: 11px; background: rgba(0, 0, 0, .12); padding: 1px 6px; }

/* ------------------------------------------------------------------ lists of things */
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 2px 8px; margin: 6px 0 14px; }
.cell { display: flex; align-items: center; gap: 6px; padding: 2px 4px; font-size: 13px; }
.cell span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 8px 0 16px; }
.cards:has(.wide) { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 6px;
  border: 1px solid var(--line-soft); background: var(--box); color: var(--link); }
.card:hover { border-color: var(--line); text-decoration: none; }
.card img { width: 100%; aspect-ratio: 1; object-fit: contain; max-width: 100%; }
.card.wide img { aspect-ratio: 16 / 10; object-fit: cover; }
.card b { font-weight: 700; }
.card small { color: var(--muted); font-size: 12px; }
.fam { display: flex; flex-wrap: wrap; gap: 2px 10px; }
.gallery { display: flex; flex-wrap: wrap; gap: 10px; }
.gallery figure { margin: 0; width: 170px; text-align: center; background: var(--box); border: 1px solid var(--line-soft); padding: 4px; }
.gallery img { width: 100%; aspect-ratio: 1; object-fit: contain; max-width: 100%; }
.gallery figcaption { font-size: 12.5px; color: var(--muted); }

/* ------------------------------------------------------------------ main page */
.home-hero { margin: 0 0 14px; border: 1px solid var(--line); overflow: hidden; background: var(--box); }
.home-hero img { width: 100%; height: 260px; object-fit: cover; display: block; }
.home-hero .ht { padding: 10px 16px 12px; border-top: 1px solid var(--line); background: var(--mint); color: var(--mint-ink); }
.home-hero h1 { border: 0; margin: 0; padding: 0; font-size: 30px; color: var(--mint-ink); }
.home-hero p { margin: 2px 0 0; max-width: 60em; }

/* ------------------------------------------------------------------ phone */
@media (max-width: 860px) {
  .menu { display: inline-block; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; z-index: 40; background: var(--page); width: 220px; overflow: auto;
    transform: translateX(-100%); transition: transform .2s; border-right: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px); }
  body.nav-open .side { transform: none; }
  .main-col { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .search { margin-left: 0; flex: 1; }
  .content { padding: 12px 14px 20px; }
  .infobox { float: none; width: 100%; margin: 0 0 12px; }
  h1 { font-size: 24px; }
  .home-hero img { height: 180px; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

</style>
<div class="layout">
  <aside id="side" class="side">
    <a class="brand" href="#home"><span class="ic logo" id="logo"></span><span id="brand">隙浮 Wiki</span></a>
    <nav id="nav"></nav>
  </aside>
  <div class="main-col">
    <header class="top">
      <button class="tool menu" id="menu">☰</button>
      <div class="search">
        <input id="q" type="search" autocomplete="off">
        <div id="results" class="results" hidden></div>
      </div>
      <button class="tool" id="lang">EN</button>
      <button class="tool" id="theme">◐</button>
    </header>
    <main id="main" class="content"></main>
    <footer class="foot" id="foot"></footer>
  </div>
</div>
<script>window.WIKI_FETCH=true;</script>
<script>
(function () {
  "use strict";
  // Data comes as data.zh.js / data.en.js (script tags: works from file:// and GitHub Pages) or, on the claude.ai page,
  // as data.<lang>.json fetched beside the page (window.WIKI_FETCH).
  var UI = {
    zh: { search: "搜尋隙浮 Wiki", nav: "導覽", game: "遊戲內容", toc: "目錄", home: "首頁", notFound: "找不到頁面",
      notFoundText: "沒有這一頁。可以用上方的搜尋找看看。", noHits: "找不到符合的結果", loadFail: "資料載入失敗，請重新整理頁面。",
      kinds: { item: "物品", mob: "生物", biome: "生態域", structure: "建築", "": "頁面" },
      lists: { item: ["物品", "items"], mob: ["生物", "mobs"], biome: ["生態域", "biomes"], structure: ["建築與地形", "structures"] },
      foot: "本 Wiki 由模組資料自動產生（tools/wiki/build_wiki.py）。", source: "原始碼", menu: "導覽選單", theme: "切換深色／淺色",
      brand: "隙浮 Wiki", other: "English" },
    en: { search: "Search the Sift Wiki", nav: "Navigation", game: "Game content", toc: "Contents", home: "Home",
      notFound: "Page not found", notFoundText: "There is no such page. Try the search box above.", noHits: "No results",
      loadFail: "Could not load the wiki data. Reload the page.",
      kinds: { item: "Item", mob: "Mob", biome: "Biome", structure: "Structure", "": "Page" },
      lists: { item: ["Items", "items"], mob: ["Mobs", "mobs"], biome: ["Biomes", "biomes"], structure: ["Structures and terrain", "structures"] },
      foot: "This wiki is generated from the mod's data (tools/wiki/build_wiki.py).", source: "Source code",
      menu: "Navigation menu", theme: "Switch dark / light", brand: "The Sift Wiki", other: "中文" }
  };
  var REPO = "https://github.com/PrYuan05/the-sift-pryuan-version";
  var main = document.getElementById("main");
  var nav = document.getElementById("nav");
  var q = document.getElementById("q");
  var results = document.getElementById("results");
  var W = null, T = UI.zh, lang = "zh";

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // routes like "item/soul_essence" travel in the hash as "item--soul-essence" (letters, digits, hyphens only);
  // ids never contain "-", so the mapping is reversible. Old "#/item/soul_essence" links still work.
  function enc(r) { return r.replace(/\//g, "--").replace(/_/g, "-"); }
  function dec(h) { return h.charAt(0) === "/" ? h.slice(1) : h.replace(/--/g, "/").replace(/-/g, "_"); }
  function fixLinks(root) {
    [].forEach.call(root.querySelectorAll('a[href^="#/"]'), function (a) { a.setAttribute("href", "#" + enc(a.getAttribute("href").slice(2))); });
  }

  // ---------------------------------------------------------------- theme (a per-viewer convenience)
  var savedTheme = store("sift-theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  document.getElementById("theme").onclick = function () {
    var cur = document.documentElement.getAttribute("data-theme");
    if (!cur) cur = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    store("sift-theme", next);
  };
  document.getElementById("menu").onclick = function () { document.body.classList.toggle("nav-open"); };

  // ---------------------------------------------------------------- language
  function load(l, done) {
    var D = window.WIKI_DATA || (window.WIKI_DATA = {});
    if (D[l]) return done(D[l]);
    if (window.WIKI_FETCH) {
      fetch("data." + l + ".json").then(function (r) { return r.json(); }).then(function (d) { D[l] = d; done(d); })
        .catch(function () { main.innerHTML = "<p>" + UI[l].loadFail + "</p>"; });
      return;
    }
    var s = document.createElement("script");
    s.src = "data." + l + ".js";
    s.onload = function () { done(D[l]); };
    s.onerror = function () { main.innerHTML = "<p>" + UI[l].loadFail + "</p>"; };
    document.head.appendChild(s);
  }
  function setLang(l) {
    load(l, function (d) {
      W = d; lang = l; T = UI[l];
      store("sift-lang", l);
      document.documentElement.lang = l === "zh" ? "zh-Hant" : "en";
      document.getElementById("lang").textContent = T.other;
      document.getElementById("lang").title = T.other;
      document.getElementById("brand").textContent = T.brand;
      document.getElementById("menu").setAttribute("aria-label", T.menu);
      document.getElementById("theme").setAttribute("aria-label", T.theme);
      document.getElementById("theme").title = T.theme;
      q.placeholder = T.search;
      q.setAttribute("aria-label", T.search);
      nav.setAttribute("aria-label", T.nav);
      var logo = W.items["pysift:soul_crystal_block"];
      var n = logo ? logo[0] : 0;
      document.getElementById("logo").setAttribute("style", "--x:" + (n % W.cols) + ";--y:" + Math.floor(n / W.cols));
      buildNav();
      document.getElementById("foot").innerHTML = esc(T.foot) + ' <a href="' + REPO + '">' + esc(T.source) + "</a>";
      route();
    });
  }
  document.getElementById("lang").onclick = function () { setLang(lang === "zh" ? "en" : "zh"); };

  // ---------------------------------------------------------------- nav (MediaWiki-style portlets)
  function buildNav() {
    var groups = [[T.nav, []]], g = groups[0];
    W.nav.forEach(function (n) {
      if (!n[1]) { g = [T.game, []]; groups.push(g); return; }
      g[1].push('<a href="#' + enc(n[1]) + '" data-r="' + n[1] + '">' + esc(n[0]) + "</a>");
    });
    nav.innerHTML = groups.map(function (g) { return '<div class="portlet"><h3>' + esc(g[0]) + "</h3>" + g[1].join("") + "</div>"; }).join("");
  }

  // ---------------------------------------------------------------- router
  function route() {
    if (!W) return;
    var r = dec(decodeURIComponent((location.hash || "#home").slice(1))) || "home";
    var p = W.pages[r];
    if (!p) {
      main.innerHTML = "<h1>" + T.notFound + "</h1><p>" + T.notFoundText + "</p>";
      document.title = T.notFound + " - " + T.brand;
      return;
    }
    main.innerHTML = crumbs(r) + p[1] + navbox(r);
    [].forEach.call(main.querySelectorAll(".rcp"), function (d) { d.outerHTML = recipe(W.recipes[+d.getAttribute("data-i")]); });
    fixLinks(main);
    toc();
    document.title = r === "home" ? T.brand : p[0] + " - " + T.brand;
    var sec = { item: "items", mob: "mobs", biome: "biomes", structure: "structures" }[r.split("/")[0]];
    [].forEach.call(nav.querySelectorAll("a"), function (a) {
      var dr = a.getAttribute("data-r");
      a.classList.toggle("on", dr === r || dr === sec);
    });
    document.body.classList.remove("nav-open");
    window.scrollTo(0, 0);
  }
  function crumbs(r) {
    var l = T.lists[r.split("/")[0]];
    if (!l) return "";
    return '<div class="crumbs"><a href="#home">' + T.home + '</a> › <a href="#' + l[1] + '">' + esc(l[0]) + "</a></div>";
  }
  // table of contents, MediaWiki style, for pages with three or more sections
  function toc() {
    var hs = [].filter.call(main.querySelectorAll("h2, h3"), function (h) { return !h.closest(".infobox, .navbox"); });
    if (hs.filter(function (h) { return h.tagName === "H2"; }).length < 3) return;
    var a = 0, b = 0, items = "";
    hs.forEach(function (h, i) {
      h.id = "s" + i;
      if (h.tagName === "H2") { a++; b = 0; items += '<li><a href="#" data-t="s' + i + '"><span class="tn">' + a + "</span>" + esc(h.textContent) + "</a></li>"; }
      else { b++; items += '<li class="sub"><a href="#" data-t="s' + i + '"><span class="tn">' + a + "." + b + "</span>" + esc(h.textContent) + "</a></li>"; }
    });
    var box = document.createElement("div");
    box.className = "toc";
    box.innerHTML = '<div class="toc-t">' + T.toc + "</div><ul>" + items + "</ul>";
    var first = hs[0];
    first.parentNode.insertBefore(box, first);
    box.addEventListener("click", function (e) {
      var t = e.target.closest("a");
      if (t) { e.preventDefault(); document.getElementById(t.getAttribute("data-t")).scrollIntoView(); }
    });
  }
  // navbox at the foot of mob / biome / structure pages: every page of that kind
  function navbox(r) {
    var k = r.split("/")[0], l = T.lists[k];
    if (!l || k === "item") return "";
    var links = W.search.filter(function (s) { return s[3] === k; }).map(function (s) {
      return s[0] === r ? "<b>" + esc(s[1]) + "</b>" : '<a href="#' + enc(s[0]) + '">' + esc(s[1]) + "</a>";
    });
    return '<table class="navbox"><tr><th><a href="#' + l[1] + '">' + esc(l[0]) + "</a></th></tr><tr><td>" + links.join(" · ") + "</td></tr></table>";
  }

  // ---------------------------------------------------------------- recipes (compact data -> inventory GUI)
  function icon(id, size) {
    var it = W.items[id] || [0, id, 0];
    var n = it[0], c = W.cols;
    var span = '<span class="ic s' + size + '" style="--x:' + (n % c) + ";--y:" + Math.floor(n / c) + '" title="' + esc(it[1]) + '"></span>';
    return it[2] ? '<a href="#' + enc("item/" + id.slice(7)) + '">' + span + "</a>" : span;
  }
  function slot(ids) {
    if (!ids || !ids.length) return '<span class="slot"></span>';
    return '<span class="slot' + (ids.length > 1 ? " multi" : "") + '">' + ids.map(function (x, k) {
      return '<span class="cyc' + (k ? "" : " on") + '">' + icon(x, 32) + "</span>";
    }).join("") + "</span>";
  }
  function recipe(r) {
    if (!r) return "";
    var lay = r[3], s = r[4], body;
    if (lay === "g") body = '<span class="grid3">' + s.map(slot).join("") + "</span>";
    else if (lay === "r") body = '<span class="row">' + s.map(slot).join("") + "</span>";
    else if (lay === "b") body = '<span class="row">' + slot(s[0]) + '<span class="tag">' + esc(r[6]) + "</span>" + slot(s[1]) + "</span>";
    else body = '<span class="row">' + slot(s[0]) + '<span class="flame"></span>' + (r[6] ? '<span class="tag">' + esc(r[6]) + "</span>" : "") + "</span>";
    var out = '<span class="slot big">' + icon(r[1], 32) + (r[2] > 1 ? '<span class="cnt">' + r[2] + "</span>" : "") + "</span>";
    return '<div class="recipe"><div class="rk">' + esc(r[0]) + '</div><div class="rb">' + body + '<span class="arrow">➜</span>' + out +
      '</div><div class="rn">' + esc(r[5]) + "</div></div>";
  }

  // ---------------------------------------------------------------- search (titles in both languages)
  function search(term) {
    term = term.trim().toLowerCase();
    if (!term || !W) { results.hidden = true; return; }
    var hits = [];
    for (var i = 0; i < W.search.length && hits.length < 40; i++) {
      var s = W.search[i];
      var hay = (s[1] + " " + s[2]).toLowerCase();
      if (hay.indexOf(term) >= 0) hits.push([s[1].toLowerCase().indexOf(term) === 0 ? 0 : s[1].toLowerCase().indexOf(term) > 0 ? 1 : 2, s]);
    }
    hits.sort(function (a, b) { return a[0] - b[0] || a[1][1].length - b[1][1].length; });
    results.innerHTML = hits.length ? hits.map(function (h) {
      var s = h[1];
      return '<a href="#' + enc(s[0]) + '"><span class="k">' + (T.kinds[s[3]] || T.kinds[""]) + "</span>" + esc(s[1]) + "</a>";
    }).join("") : '<div class="none">' + T.noHits + "</div>";
    results.hidden = false;
  }
  q.addEventListener("input", function () { search(q.value); });
  q.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { var a = results.querySelector("a"); if (a) { location.hash = a.getAttribute("href"); q.blur(); results.hidden = true; q.value = ""; } }
    if (e.key === "Escape") { results.hidden = true; q.blur(); }
  });
  results.addEventListener("click", function () { results.hidden = true; q.value = ""; });
  document.addEventListener("click", function (e) { if (!e.target.closest(".search")) results.hidden = true; });

  // ---------------------------------------------------------------- cycling ingredients (tags), like the wiki
  setInterval(function () {
    [].forEach.call(document.querySelectorAll(".slot.multi"), function (s) {
      var c = s.querySelectorAll(".cyc");
      for (var i = 0; i < c.length; i++) {
        if (c[i].classList.contains("on")) { c[i].classList.remove("on"); c[(i + 1) % c.length].classList.add("on"); break; }
      }
    });
  }, 1400);

  window.addEventListener("hashchange", route);
  var start = store("sift-lang") || ((navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en");
  setLang(start === "en" ? "en" : "zh");
})();

</script>
