plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}
	// Sodium: compile-only, for the optional spirit liquid mixin on Sodium's fluid renderer (SodiumFluidRendererMixin)
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"pysift" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Headless server for worldgen tests (tools/worldgen/devserver.py); separate dir so it never touches the client's run/
		siftTestServer {
			server()
			name "Sift Test Server"
			runDir "run-server"
			ideConfigGenerated false
		}
	}
}

configurations {
	devModsFolder { transitive = false }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:5.5.7"

	// Not shipped or required: only lets SodiumFluidRendererMixin compile (it applies only when Sodium is installed)
	clientCompileOnly "maven.modrinth:sodium:mc26.3-0.9.2-fabric"

	// Dev-only tools for runClient (not shipped, not dependencies of pysift):
	//   Live Texture Editor - edit block / item / entity textures in game (look at a block, press R); export the edits
	//   as a resource pack and write them back with tools/texture_pipeline/import_texture_pack.py
	localRuntime "maven.modrinth:livetextureeditor:qmblUJWn" // 3.0 for MC 26.3 (Modrinth version ids: version numbers
	                                                          // such as Axiom's "6.1.3" are shared by every MC build)
	//   Axiom (world editor / building tool) + DBTools (extra Axiom tools). On the dev classpath Fabric Loader fails to
	//   resolve Axiom ("fabricloader missing"), so they are copied into run/mods instead (task syncDevMods, runs before runClient)
	devModsFolder "maven.modrinth:axiom:CrfjL7cY"           // Axiom 6.1.3 for MC 26.3
	devModsFolder "maven.modrinth:dbtools:UpP9xeHF"         // DBTools 2.4.1+MC26.3-AX6.1.3
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Configure Java Toolchain to strictly target Java 25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Axiom + DBTools for the dev client: copied into run/mods (see devModsFolder above); other files in run/mods are kept
tasks.register("syncDevMods", Copy) {
	from configurations.devModsFolder
	into layout.projectDirectory.dir("run/mods")
}
tasks.named("runClient") { dependsOn "syncDevMods" }
